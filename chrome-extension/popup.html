<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Forge Time Tracker</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <div class="brand"><span>F</span><strong>Forge</strong></div>
      <p id="page" class="page">Reading current browser page…</p>
      <label
        >Forge address<input
          id="forgeUrl"
          type="url"
          placeholder="https://forge.christianfoster.dev"
      /></label>
      <label
        >Pairing code<input
          id="pairingCode"
          type="password"
          placeholder="Generate this in Forge Time Tracker"
        />
      </label>
      <button id="connect">Connect / refresh timer</button>
      <section id="timer" class="timer" hidden>
        <p id="status">No timer is active.</p>
        <strong id="elapsed">00:00:00</strong>
        <button id="stop" class="stop">Stop shared timer</button>
      </section>
      <label
        >Work note<textarea id="note" placeholder="What are you doing on this page?"></textarea>
      </label>
      <button id="open">Open Forge Time Tracker</button>
      <p class="hint">
        Forge keeps one secure, shared timer for your account. Pair once to see and stop it from
        Chrome.
      </p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
